- date: "2026.10"
  text: "The research 'Theory and Methods for Strategic Mineral Security Management Based on Industrial Ecology' received First Prize at the 10th Management Science Awards of the Chinese Society of Management Science (ranked 5/8). 基于产业生态的战略性矿产安全管理理论与方法，获第十届中国管理科学学会管理科学奖一等奖。"

- date: "2026.06.29"
  text: "Awarded the <a href='https://www.chinapostdoctor.org.cn/article?inid=c1c008e3-1564-4ef8-a1be-b236a134ea5b&amp;catid=8c892b1c-4ade-4a5f-9a87-5e736cb5e9f9' target='_blank'>China Postdoctoral Science Foundation Special Grant (19th Batch)</a> for the project 'Formation Mechanisms and Conversion Efficiency of Regenerated Rare Earth Resource Supply'."

- date: "2026.06.01"
  text: "Awarded the <a href='https://sklam.ustb.edu.cn/tzgg2/8137b04f2be94e5a911737c39796c7ca.htm' target='_blank'>Open Fund of the National Key Laboratory of Green and Low-Carbon Steel Metallurgy, University of Science and Technology Beijing</a> for the project 'Mechanisms and Techno-Economic Assessment of Maximum Emission Reduction through Oxygen-Hydrogen Coupled Blast Furnace Stock Retrofitting'."

- date: "2026.05.24"
  text: "Gave an oral presentation titled 'Material Flow Analysis and Demand Forecasting for Critical Metals' at <a href='https://mp.weixin.qq.com/s/buCfVSXdi0XTvGzxLPJvRg' target='_blank'>The 7th Workshop on Resource Security and Economic Sciences</a>, Xiamen University."

- date: "2026.04.25"
  text: "The research advance 'Methodological Innovation and Application Demonstration in Resource Economic Geography' was selected as one of the <a href='https://www.gsc.org.cn/gsc/zhiKuDetail.html?id=23&amp;contentId=2352' target='_blank'>Top Ten Research Advances in Chinese Geographical Science 2025</a> by the Geographical Society of China, ranked 7/9."

- date: "2026"
  text: "Our first-author paper, <a href='https://doi.org/10.1016/j.eng.2026.09.012' target='_blank'>Sectoral Coordination to Maximize China’s National and Provincial Building Carbon Emissions Mitigation</a>, was published in <em>Engineering</em>."

- date: "2026"
  text: "Our collaborative paper, <a href='https://doi.org/10.1016/j.eng.2026.05.017' target='_blank'>Battery Material Demand and End-of-Life Management for Europe’s E-Mobility Transition</a>, was published in <em>Engineering</em>."

- date: "2026"
  text: "Our collaborative paper, '中国风光发电设备报废资源时空格局、回收潜力及管理政策', was published in <em>资源科学</em>. <a href='/full-publications/'>View publication list</a>."

- date: "2025.09"
  text: "Invited talk at Nanchang University on building metabolism and sustainability."

- date: "2025.08.25"
  text: "Received the Outstanding Young Presentation Award at the 7th Annual Conference on Global Resource Flow and Management Research in Lanzhou. 获第七届全球资源流动与管理研究学术年会优秀青年报告奖。"

- date: "2025"
  text: "Awarded an NSFC Young Scientists Fund (Category C) grant (No. 72504011) as Principal Investigator for research on regulating secondary rare earth resource supply potential and optimizing large-scale recycling pathways (2026–2028). <a href='/full-projects/'>View project details</a>."
